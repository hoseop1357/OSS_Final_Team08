# 시연용 가상 계약 지점(카메라 위치). 실제 운영사나 실제 설치 위치가 아니다.
# 일반 영상에는 GPS가 없으므로 킥보드가 아니라 "카메라 위치"를 지도에 표시한다.
# location_source: "configured"(실제로 확인한 좌표) / "default"(세종시 임의 좌표, 화면에 '임의 위치'로 표시)

default_location:       # 좌표를 모를 때 쓰는 세종시 임의 좌표
