# 연관·추적·판정 로직 임계값 (Project_Rule.md 5.1절). 코드에 숫자를 직접 쓰지 않는다.
# 아래 값은 초기 추정치이며, 실제 영상으로 오탐·미탐을 확인한 뒤 조정하고 docs/experiments.md에 기록한다.

conf_thres: 0.25          # 탐지 confidence 하한. 이보다 낮은 박스는 버린다.
foot_margin_ratio: 0.10   # 킥보드 박스의 좌우·하단을 이 비율만큼 넓혀 발 위치를 검사한다.

# 아래 3개는 v0.3(추적·판정)에서 사용한다.
window_sec: 1.0           # 판정 시간 창(초)
violation_ratio: 0.6      # 창 안에서 탑승자 2인 이상 프레임 비율이 이 값 이상이면 위반
min_move_px: 40           # 창 동안 킥보드 중심 이동 거리(px)가 이 값 미만이면 정차로 보고 판정 제외
