# 연관·추적·판정 로직 임계값 (Project_Rule.md 5.1절). 코드에 숫자를 직접 쓰지 않는다.
# 아래 값은 초기 추정치이며, 실제 영상으로 오탐·미탐을 확인한 뒤 조정하고 docs/experiments.md에 기록한다.

conf_thres: 0.25          # 탐지 confidence 하한. 이보다 낮은 박스는 버린다.
foot_margin_ratio: 0.10   # 킥보드 박스의 좌우·하단을 이 비율만큼 넓혀 발 위치를 검사한다.

# 판정 (src/logic/violation.py)
window_sec: 1.0           # 판정 시간 창(초)
violation_ratio: 0.6      # 창 안에서 탑승자 2인 이상 프레임 비율이 이 값 이상이면 위반. 킥보드가 안 보인 프레임은 위반 아님으로 센다.
min_move_ratio: 0.3       # 창 동안 킥보드 중심 이동 거리가 (킥보드 박스 평균 너비 x 이 값) 미만이면 정차로 보고 위반을 새로 확정하지 않는다.
                          # 원근 때문에 먼 킥보드는 작게 움직이므로 픽셀 고정값 대신 박스 너비 비율을 쓴다. 손잡이 추정에 흔들리는 높이 대신 너비를 쓴다.
max_gap_sec: 0.5          # 열린 이벤트는 탑승자 2명 이상이 마지막으로 보인 뒤 이 시간이 지나면 끝난다.
                          # 그보다 짧은 추적 끊김·탐지 누락은 같은 이벤트로 이어 붙인다(중복 이벤트 방지).
