# 스모크 학습: 환경과 학습 파이프라인이 끝까지 도는지만 확인한다.
# coco8(8장)은 Ultralytics가 자동으로 내려받는 예제 데이터라 클래스 검사는 하지 않는다.

experiment:
  name: smoke
